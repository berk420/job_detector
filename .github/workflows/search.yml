name: LinkedIn Job Search

on:
  schedule:
    - cron: "*/15 * * * *"   # Her 15 dakikada bir
  workflow_dispatch:        # Manuel tetikle

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LinkedIn search
        env:
          LI_AT: ${{ secrets.LI_AT }}
          LI_EMAIL: ${{ secrets.LI_EMAIL }}
          LI_PASSWORD: ${{ secrets.LI_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scraper.main

      - name: Commit updated results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/jobs.json data/seen_jobs.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: update job results [$(date -u '+%Y-%m-%d %H:%M UTC')]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
